name: Deploy FinKit v9 Stable Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify self-contained homepage and content layer
        shell: bash
        run: |
          set -euo pipefail

          test -f site/index.html
          test -f site/CNAME
          test -f site/ads.txt
          test -f site/sitemap.xml
          test -f site/llms.txt
          test -f site/version.json
          test -f site/.nojekyll
          test "$(tr -d '\r\n' < site/CNAME)" = "finkit.top"

          grep -q "FinKit v9 STABLE" site/index.html
          grep -q "__FINKIT_V8__" site/index.html
          grep -q "海外所得與最低稅負 AMT" site/index.html

          # Homepage must render as a useful site even if JS never runs.
          test "$(grep -o 'class="fallback-grid"' site/index.html | wc -l)" -ge 1
          test "$(grep -o '/tools/[^"?]*\.html' site/index.html | sort -u | wc -l)" -ge 24
          test "$(grep -o '/learn/[^"?]*\.html' site/index.html | sort -u | wc -l)" -ge 6

          # Critical homepage assets are inline: no CSS/JS network dependency.
          if grep -Eiq '<script[^>]+src=|<link[^>]+rel="stylesheet"' site/index.html; then
            echo "Homepage still depends on external CSS/JS."
            exit 1
          fi

          # Source JS still must parse, because the same logic is embedded in index.html.
          node --check site/tools-data.js
          node --check site/app.js

          # Keep app shell free of ad-serving code during approval.
          if grep -Eiq 'pagead2\.googlesyndication\.com|adsbygoogle' site/index.html; then
            echo "Ad-serving script found on homepage."
            exit 1
          fi

          test "$(find site/tools -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 25
          test "$(find site/learn -maxdepth 1 -type f -name '*.html' | wc -l)" -ge 9
          test "$(wc -c < site/index.html)" -gt 30000

          echo "FinKit v9 verification passed: homepage is self-contained and useful without JavaScript."

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
